name: SEC Company Facts Test

on:
  workflow_dispatch:

jobs:

  sec-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SEC test
        env:
          SEC_USER_AGENT: "stock-master-sec-test/0.1 YOUR_EMAIL@example.com"
        run: |
          python tests/test_sec_companyfacts.py

      - name: Upload SEC raw response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-test-raw
          path: data/raw/sec/