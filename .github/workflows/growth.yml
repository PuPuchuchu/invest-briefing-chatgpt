name: Growth Factor Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  growth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install pytest
        run: |
          pip install pytest

      - name: Run Growth tests
        run: |
          pytest -q tests/test_growth.py
