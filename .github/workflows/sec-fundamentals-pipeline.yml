name: SEC Fundamental Pipeline Test

on:
  workflow_dispatch:

jobs:
  fundamentals-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SEC fundamental pipeline
        env:
          SEC_USER_AGENT: "invest-briefing-claude/0.1 chks7788@gmail.com"
        run: |
          python tests/test_sec_fundamentals_pipeline.py

      - name: Upload SEC pipeline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-fundamentals-pipeline
          path: |
            data/raw/sec/
            data/processed/fundamentals/