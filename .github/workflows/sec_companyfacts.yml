name: SEC Company Facts Test

on:
  workflow_dispatch:

jobs:

  sec-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run SEC test
        continue-on-error: true
        env:
          SEC_USER_AGENT: "stock-master-sec-test/0.1 ..."
        run: |
          python tests/test_sec_companyfacts.py

      - name: Inspect SEC concepts
        run: |
          python tests/test_sec_fact_diagnostics.py

      - name: Test Stockholders Equity Coverage
        run: |
          pytest -q tests/test_stockholders_equity_coverage.py -s

      - name: Upload SEC raw response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-test-raw
          path: data/raw/sec/