name: SEC Fundamental Extraction Test

on:
  workflow_dispatch:

jobs:
  fundamentals-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SEC fundamental extraction test
        run: |
          python tests/test_sec_fundamentals.py

      - name: Upload processed fundamentals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-fundamentals-test
          path: data/processed/fundamentals/