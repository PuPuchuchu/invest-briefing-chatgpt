name: Stockholders Equity Coverage Test

on:
  workflow_dispatch:

jobs:
  stockholders-equity-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Stockholders Equity Coverage Test
        run: |
          pytest -q tests/test_stockholders_equity_coverage.py -s