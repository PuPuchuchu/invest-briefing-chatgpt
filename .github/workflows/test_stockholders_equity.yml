name: Test Stockholders Equity Coverage

on:
  workflow_dispatch:

jobs:
  test-stockholders-equity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Stockholders Equity Coverage Test
        run: |
          pytest -q tests/test_stockholders_equity_coverage.py -s